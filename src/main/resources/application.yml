server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # lb:// = tra tên service trên Eureka rồi load-balance giữa các instance
            - id: catalog-service
              uri: lb://catalog-service
              predicates:
                - Path=/api/v1/flowers/**
            - id: customer-service
              uri: lb://customer-service
              predicates:
                - Path=/api/v1/customers/**
            - id: identity-service
              uri: lb://identity-service
              predicates:
                - Path=/api/v1/auth/**,/api/v1/users/**,/api/v1/roles/**,/.well-known/jwks.json
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${IDENTITY_JWKS_URI:http://localhost:8083/.well-known/jwks.json}
          issuer-uri: flower-shop-identity
          audiences: flower-shop-api

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

management:
  endpoints:
    web:
      exposure:
        include: health,info
