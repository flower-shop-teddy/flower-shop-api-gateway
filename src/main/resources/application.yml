server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # lb:// = tra tên service trên Eureka rồi load-balance giữa các instance
            - id: catalog-service
              uri: lb://catalog-service
              predicates:
                - Path=/api/v1/flowers/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

management:
  endpoints:
    web:
      exposure:
        include: health,info
